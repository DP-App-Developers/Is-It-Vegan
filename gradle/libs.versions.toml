[versions]
agp                    = "8.5.2"
kotlin                 = "2.0.21"
ksp                    = "2.0.21-1.0.28"

composeBom             = "2024.12.01"
activityCompose        = "1.9.3"

lifecycleViewmodel     = "2.8.7"

navigationCompose      = "2.8.5"

hilt                   = "2.56"
hiltNavCompose         = "1.2.0"

camerax                = "1.4.1"

mlkitTextRecognition   = "16.0.1"

room                   = "2.6.1"

coroutines             = "1.9.0"

junit4                 = "4.13.2"
mockk                  = "1.13.13"

accompanistPermissions = "0.37.2"

kotlinxSerialization   = "1.7.3"

firebaseBom            = "33.7.0"
googleServices         = "4.4.2"

[libraries]
compose-bom                = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui                 = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling         = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3          = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons     = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose           = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodel" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleViewmodel" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleViewmodel" }

navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

hilt-android            = { group = "com.google.dagger", name = "hilt-android",  version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavCompose" }

camera-core     = { group = "androidx.camera", name = "camera-core",      version.ref = "camerax" }
camera-camera2  = { group = "androidx.camera", name = "camera-camera2",   version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view     = { group = "androidx.camera", name = "camera-view",       version.ref = "camerax" }

mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }

room-runtime   = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx       = { group = "androidx.room", name = "room-ktx",     version.ref = "room" }
room-compiler  = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

coroutines-android      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",   version.ref = "coroutines" }

junit4 = { group = "junit",    name = "junit", version.ref = "junit4" }
mockk  = { group = "io.mockk", name = "mockk", version.ref = "mockk"  }

accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanistPermissions" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

firebase-bom       = { group = "com.google.firebase", name = "firebase-bom",      version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }

[plugins]
android-application  = { id = "com.android.application",                         version.ref = "agp"    }
kotlin-android       = { id = "org.jetbrains.kotlin.android",                     version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",        version.ref = "kotlin" }
kotlin-parcelize     = { id = "org.jetbrains.kotlin.plugin.parcelize",            version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",                          version.ref = "ksp"    }
hilt                 = { id = "com.google.dagger.hilt.android",                   version.ref = "hilt"   }
compose-compiler     = { id = "org.jetbrains.kotlin.plugin.compose",              version.ref = "kotlin" }
google-services      = { id = "com.google.gms.google-services",                   version.ref = "googleServices" }
